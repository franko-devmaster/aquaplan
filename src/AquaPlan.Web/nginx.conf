server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Audit F-035cc — hide the nginx version from response headers and error pages.
    server_tokens off;

    # AQ-425 follow-up — Safari iOS "HTTPS Only" refuse les pages servies en HTTP sur un
    # domaine public. Quand DSM reverse proxy route un hit HTTP:80 vers notre container
    # (règle "http://aquaplan.synology.me" → http://localhost:8880), le header
    # X-Forwarded-Proto = "http" nous dit que la requête arrive en HTTP. On redirige en
    # 301 vers HTTPS. Les hits HTTPS arrivent avec X-Forwarded-Proto=https et passent
    # normalement. Les accès directs LAN (http://192.168.1.159:8880) n'ont pas ce header
    # et servent l'app normalement.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Sprint Sec F-006 (cross-cutting) — security headers (CSP, X-Frame-Options, …) live
    # in security-headers.conf. `add_header` is NOT inherited by location blocks that set
    # their own headers (Cache-Control below), so the include is repeated in EVERY such
    # location. Without this, HTML documents were served without any security header.
    include /etc/nginx/security-headers.conf;

    # AQ-408 — Safari iOS fetches the SW with very aggressive caching by default.
    # Force no-cache on the SW files and the control manifest so a deploy is picked up
    # on the very next visit (worker check window). Hashed .js/.css bundles stay cached
    # long-term via the "immutable" rule below.
    location = /ngsw-worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Safari is strict about Content-Type for module workers.
        types { } default_type application/javascript;
    }

    location = /safety-worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { } default_type application/javascript;
    }

    location = /worker-basic.min.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { } default_type application/javascript;
    }

    location = /ngsw.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        types { } default_type application/json;
    }

    # AQ-408 — never cache the entry document: the hashed-bundle references inside
    # must reach Safari fresh, otherwise a stale SW keeps rehydrating a dead DOM.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        types { } default_type application/manifest+json;
    }

    # Hashed Angular bundles (main-<hash>.js, polyfills-<hash>.js, chunk-<hash>.js, styles-<hash>.css)
    # are content-addressed — safe to cache aggressively. Hashes are mixed-case base32-ish
    # (Angular esbuild) so we match on "at least 6 alphanumerics right before the extension".
    location ~* "^/[^/]+-[A-Z0-9]{6,}\.(?:js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # No add_header here — inherits the server-level security headers.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://aquaplan-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml image/svg+xml;
}
