# Sprint Sec F-006 (cross-cutting) — shared security headers.
#
# nginx `add_header` directives are NOT inherited by a location block that declares
# any `add_header` of its own (e.g. our Cache-Control rules). This file must therefore
# be included in the `server` block AND in every `location` that sets its own headers,
# otherwise HTML documents are served without CSP/X-Frame-Options.
# Verify after deploy: curl -sI https://<host>/ | grep -i content-security
#
# `always` ensures the headers are also sent on error responses (4xx/5xx).

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'" always;
