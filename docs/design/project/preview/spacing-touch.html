<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Touch targets</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-family-base);}
.wrap{padding:18px 20px;box-sizing:border-box;width:700px;}
.label{font-size:11px;color:var(--color-fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin:0 0 12px;font-weight:600;}
.row{display:flex;align-items:center;gap:24px;}
.item{text-align:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1.5px dashed var(--color-primary-400);background:rgba(31,122,166,0.06);border-radius:8px;color:var(--color-primary-700);}
.item .m{font-family:var(--font-family-mono);font-size:11px;margin-top:8px;color:var(--color-fg-muted);}
.item .n{font-size:12px;font-weight:600;margin-top:4px;}
</style><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head><body>
<div class="wrap">
<div class="label">Touch targets — ≥44 mobile · ≥48 iPad</div>
<div class="row">
  <div class="item"><div class="btn" style="width:40px;height:40px"><span class="material-icons-outlined" style="font-size:20px">search</span></div><div class="n">sm</div><div class="m">40px · paginator</div></div>
  <div class="item"><div class="btn" style="width:44px;height:44px"><span class="material-icons-outlined" style="font-size:22px">edit</span></div><div class="n">md</div><div class="m">44px · mobile</div></div>
  <div class="item"><div class="btn" style="width:48px;height:48px"><span class="material-icons-outlined" style="font-size:24px">qr_code_scanner</span></div><div class="n">lg</div><div class="m">48px · iPad</div></div>
  <div class="item"><div class="btn" style="height:44px;padding:0 20px;gap:6px"><span class="material-icons-outlined" style="font-size:20px">add</span>Nouvel ordre</div><div class="n">button</div><div class="m">min-h 44px</div></div>
</div>
</div></body></html>
