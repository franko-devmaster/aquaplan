<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-family-base);}
.wrap{padding:18px 20px;box-sizing:border-box;width:700px;}
.label{font-size:11px;color:var(--color-fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin:0 0 10px;font-weight:600;}
.row{display:flex;align-items:center;gap:12px;margin:4px 0;font-size:12px;}
.row .tok{font-family:var(--font-family-mono);width:100px;color:var(--color-fg-default);font-weight:500;}
.row .px{font-family:var(--font-family-mono);width:46px;color:var(--color-fg-muted);}
.row .bar{background:#1f7aa6;height:14px;border-radius:2px;}
</style><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head><body>
<div class="wrap">
<div class="label">Spacing — 4px base grid</div>
<div class="row"><span class="tok">--space-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="tok">--space-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="tok">--space-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="tok">--space-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="tok">--space-5</span><span class="px">20</span><div class="bar" style="width:20px"></div></div>
<div class="row"><span class="tok">--space-6</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="tok">--space-8</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="tok">--space-10</span><span class="px">40</span><div class="bar" style="width:40px"></div></div>
<div class="row"><span class="tok">--space-12</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="tok">--space-16</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
</div></body></html>
