<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-family-base);color:var(--color-fg-default);}
.wrap{padding:16px 20px;box-sizing:border-box;width:700px;}
.label{font-size:11px;color:var(--color-fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin:0 0 10px;font-weight:600;}
.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;}
.ic .material-icons-outlined{font-size:24px;color:var(--color-fg-default);}
.ic .m{font-family:var(--font-family-mono);font-size:10px;color:var(--color-fg-muted);text-align:center;}
.sizes{display:flex;gap:20px;align-items:flex-end;margin-top:14px;}
.sizes .material-icons-outlined{color:#166389;}
</style><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head><body>
<div class="wrap">
<div class="label">Material Icons — Outlined variant only</div>
<div class="row">
  <div class="ic"><span class="material-icons-outlined">science</span><div class="m">science</div></div>
  <div class="ic"><span class="material-icons-outlined">water_drop</span><div class="m">water_drop</div></div>
  <div class="ic"><span class="material-icons-outlined">route</span><div class="m">route</div></div>
  <div class="ic"><span class="material-icons-outlined">place</span><div class="m">place</div></div>
  <div class="ic"><span class="material-icons-outlined">assignment</span><div class="m">assignment</div></div>
  <div class="ic"><span class="material-icons-outlined">qr_code_scanner</span><div class="m">qr_code_scanner</div></div>
  <div class="ic"><span class="material-icons-outlined">analytics</span><div class="m">analytics</div></div>
  <div class="ic"><span class="material-icons-outlined">notifications_none</span><div class="m">notifications</div></div>
</div>
<div class="sizes">
  <span class="material-icons-outlined" style="font-size:16px">science</span>
  <span class="material-icons-outlined" style="font-size:20px">science</span>
  <span class="material-icons-outlined" style="font-size:24px">science</span>
  <span class="material-icons-outlined" style="font-size:32px">science</span>
  <div style="font-family:var(--font-family-mono);font-size:11px;color:var(--color-fg-muted);margin-left:10px;">16 · 20 · 24 · 32</div>
</div>
</div></body></html>
