<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Neutral</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-family-base);}
.wrap{padding:18px 20px;box-sizing:border-box;width:700px;}
.row{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;}
.sw{height:72px;border-radius:6px;position:relative;display:flex;align-items:flex-end;padding:6px 6px;box-sizing:border-box;border:1px solid rgba(0,0,0,0.04);}
.sw .n{font-size:9px;font-weight:500;}
.sw .h{font-family:var(--font-family-mono);font-size:9px;position:absolute;top:6px;left:6px;opacity:.85;}
.label{font-size:11px;color:var(--color-fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
</style><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head><body>
<div class="wrap">
<div class="label">Neutrals — warm gray</div>
<div class="row">
  <div class="sw" style="background:#fff;color:#17171a"><span class="h">0</span><span class="n">#ffffff</span></div>
  <div class="sw" style="background:#fafaf9;color:#17171a"><span class="h">25</span><span class="n">#fafaf9</span></div>
  <div class="sw" style="background:#f5f5f4;color:#17171a"><span class="h">50</span><span class="n">#f5f5f4</span></div>
  <div class="sw" style="background:#ececea;color:#17171a"><span class="h">100</span><span class="n">#ececea</span></div>
  <div class="sw" style="background:#dfdfdc;color:#17171a"><span class="h">200</span><span class="n">#dfdfdc</span></div>
  <div class="sw" style="background:#c8c8c4;color:#17171a"><span class="h">300</span><span class="n">#c8c8c4</span></div>
  <div class="sw" style="background:#9a9a96;color:#fff"><span class="h">400</span><span class="n">#9a9a96</span></div>
  <div class="sw" style="background:#6b6b67;color:#fff"><span class="h">500</span><span class="n">#6b6b67</span></div>
  <div class="sw" style="background:#4f4f4c;color:#fff"><span class="h">600</span><span class="n">#4f4f4c</span></div>
  <div class="sw" style="background:#3a3a38;color:#fff"><span class="h">700</span><span class="n">#3a3a38</span></div>
  <div class="sw" style="background:#17171a;color:#fff"><span class="h">900</span><span class="n">#17171a</span></div>
</div>
</div></body></html>
