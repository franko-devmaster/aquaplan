<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-family-base);color:var(--color-fg-default);}
.wrap{padding:18px 20px;box-sizing:border-box;width:700px;}
.row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
.sw{height:72px;border-radius:6px;position:relative;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;}
.sw .n{font-size:10px;font-weight:500;letter-spacing:0.04em;}
.sw .h{font-family:var(--font-family-mono);font-size:9px;position:absolute;top:6px;left:8px;opacity:.85;}
.label{font-size:11px;color:var(--color-fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
</style><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="ext-resource-dependency" content="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head><body>
<div class="wrap">
<div class="label">Primary — Aquaplan Deep</div>
<div class="row">
  <div class="sw" style="background:var(--color-primary-50);color:#0d3e56"><span class="h">50</span><span class="n">#eff7fb</span></div>
  <div class="sw" style="background:var(--color-primary-100);color:#0d3e56"><span class="h">100</span><span class="n">#d6ebf3</span></div>
  <div class="sw" style="background:var(--color-primary-200);color:#0d3e56"><span class="h">200</span><span class="n">#aed6e7</span></div>
  <div class="sw" style="background:var(--color-primary-300);color:#0d3e56"><span class="h">300</span><span class="n">#7ebad6</span></div>
  <div class="sw" style="background:var(--color-primary-400);color:#fff"><span class="h">400</span><span class="n">#4a99c0</span></div>
  <div class="sw" style="background:var(--color-primary-500);color:#fff;outline:2px solid #fff;outline-offset:-4px;box-shadow:0 0 0 2px var(--color-primary-500)"><span class="h">500 ★</span><span class="n">#1f7aa6</span></div>
  <div class="sw" style="background:var(--color-primary-600);color:#fff"><span class="h">600</span><span class="n">#166389</span></div>
  <div class="sw" style="background:var(--color-primary-700);color:#fff"><span class="h">700</span><span class="n">#114f6e</span></div>
  <div class="sw" style="background:var(--color-primary-800);color:#fff"><span class="h">800</span><span class="n">#0d3e56</span></div>
  <div class="sw" style="background:var(--color-primary-900);color:#fff"><span class="h">900</span><span class="n">#0a2f42</span></div>
</div>
</div></body></html>
