image: mcr.microsoft.com/dotnet/sdk:10.0

definitions:
  caches:
    nuget: ~/.nuget/packages
    npm: src/AquaPlan.Web/ClientApp/node_modules

pipelines:
  default:
    - parallel:
      - step:
          name: Build & Test .NET
          caches:
            - nuget
          script:
            - dotnet restore AquaPlan.slnx
            - dotnet build AquaPlan.slnx --configuration Release --no-restore
            - dotnet test AquaPlan.slnx --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"
          artifacts:
            - '**/TestResults/**'

      - step:
          name: Build Angular
          image: node:22-alpine
          caches:
            - npm
          script:
            - cd src/AquaPlan.Web/ClientApp
            - npm ci
            - npx ng build --configuration production
          artifacts:
            - src/AquaPlan.Web/ClientApp/dist/**

  branches:
    Main:
      - parallel:
        - step:
            name: Build & Test .NET
            caches:
              - nuget
            script:
              - dotnet restore AquaPlan.slnx
              - dotnet build AquaPlan.slnx --configuration Release --no-restore
              - dotnet test AquaPlan.slnx --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"
            artifacts:
              - '**/TestResults/**'

        - step:
            name: Build Angular
            image: node:22-alpine
            caches:
              - npm
            script:
              - cd src/AquaPlan.Web/ClientApp
              - npm ci
              - npx ng build --configuration production
            artifacts:
              - src/AquaPlan.Web/ClientApp/dist/**

      - step:
          name: Docker Build & Push
          size: 2x
          services:
            - docker
          script:
            - export TAG=${BITBUCKET_COMMIT:0:7}
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Build and push API image
            - docker build -f src/AquaPlan.Api/Dockerfile -t francoischarriere/aquaplan-api:$TAG -t francoischarriere/aquaplan-api:latest .
            - docker push francoischarriere/aquaplan-api:$TAG
            - docker push francoischarriere/aquaplan-api:latest
            # Build and push Web image
            - docker build -f src/AquaPlan.Web/Dockerfile -t francoischarriere/aquaplan-web:$TAG -t francoischarriere/aquaplan-web:latest .
            - docker push francoischarriere/aquaplan-web:$TAG
            - docker push francoischarriere/aquaplan-web:latest

      - step:
          name: Tag for Deployment
          deployment: staging
          script:
            - export TAG=${BITBUCKET_COMMIT:0:7}
            - echo "Images pushed to Docker Hub:"
            - echo "  francoischarriere/aquaplan-api:$TAG"
            - echo "  francoischarriere/aquaplan-web:$TAG"
            - echo ""
            - echo "To deploy on Synology, run on the NAS:"
            - echo "  cd /volume1/docker/aquaplan && sudo ./update.sh $TAG"
            - echo ""
            - echo "Or use 'latest' tag (auto-pulled by Synology scheduled task)"
