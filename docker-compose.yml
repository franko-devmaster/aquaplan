services:
  aquaplan-db:
    image: postgres:17
    container_name: aquaplan-db
    environment:
      POSTGRES_DB: aquaplan_dev
      POSTGRES_USER: aquaplan
      POSTGRES_PASSWORD: aquaplan_dev
    ports:
      - "5432:5432"
    volumes:
      - aquaplan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaplan -d aquaplan_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquaplan-net

  aquaplan-api:
    build:
      context: .
      dockerfile: src/AquaPlan.Api/Dockerfile
    container_name: aquaplan-api
    environment:
      # Sprint Sec F-002 — the dev admin (admin@aquaplan.ch) is only seeded in Development.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=aquaplan-db;Port=5432;Database=aquaplan_dev;Username=aquaplan;Password=aquaplan_dev"
      Jwt__SecretKey: "AquaPlan-Dev-Secret-Key-Min-32-Chars!!"
      Jwt__Issuer: "AquaPlan"
      Jwt__Audience: "AquaPlan"
    ports:
      - "5002:8080"
    depends_on:
      aquaplan-db:
        condition: service_healthy
    networks:
      - aquaplan-net

  aquaplan-web:
    build:
      context: .
      dockerfile: src/AquaPlan.Web/Dockerfile
    container_name: aquaplan-web
    ports:
      - "80:80"
    depends_on:
      - aquaplan-api
    networks:
      - aquaplan-net

  aquaplan-e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    container_name: aquaplan-e2e
    environment:
      BASE_URL: http://aquaplan-web
      API_URL: http://aquaplan-api:8080
      HEADLESS: "true"
    depends_on:
      - aquaplan-api
      - aquaplan-web
    volumes:
      - ./tests/e2e/reports:/app/reports
    networks:
      - aquaplan-net
    profiles:
      - e2e

networks:
  aquaplan-net:
    driver: bridge

volumes:
  aquaplan-db-data:
