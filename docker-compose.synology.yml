services:
  aquaplan-db:
    image: postgres:17-alpine
    container_name: aquaplan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquaplan
      POSTGRES_USER: aquaplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AquaPlan-Synology-2026!}
    volumes:
      - aquaplan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaplan -d aquaplan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquaplan-net
    mem_limit: 256m

  aquaplan-api:
    image: francoischarriere/aquaplan-api:${TAG:-latest}
    container_name: aquaplan-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=aquaplan-db;Port=5432;Database=aquaplan;Username=aquaplan;Password=${DB_PASSWORD:-AquaPlan-Synology-2026!}"
      Jwt__SecretKey: "${JWT_SECRET:-AquaPlan-Prod-Secret-Key-Min-32-Chars!!}"
      Jwt__Issuer: "AquaPlan"
      Jwt__Audience: "AquaPlan"
    depends_on:
      aquaplan-db:
        condition: service_healthy
    networks:
      - aquaplan-net
    mem_limit: 384m

  aquaplan-web:
    image: francoischarriere/aquaplan-web:${TAG:-latest}
    container_name: aquaplan-web
    restart: unless-stopped
    ports:
      - "8880:80"
    depends_on:
      - aquaplan-api
    networks:
      - aquaplan-net
    mem_limit: 64m

networks:
  aquaplan-net:
    driver: bridge

volumes:
  aquaplan-db-data:
