services:
  aquaplan-db:
    image: postgres:17-alpine
    container_name: aquaplan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquaplan
      POSTGRES_USER: aquaplan
      # Sprint Sec F-004 (cross-cutting) — no committed fallback: DB_PASSWORD is required
      # and must be defined in the NAS-local .env. Compose fails fast when missing.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (define it in the NAS-local .env)}
    volumes:
      - aquaplan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaplan -d aquaplan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquaplan-net
    mem_limit: 256m

  aquaplan-api:
    image: francoischarriere/aquaplan-api:${TAG:-latest}
    container_name: aquaplan-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Sprint Sec F-001/F-004 — secrets are required (no committed fallback values).
      # Define DB_PASSWORD and JWT_SECRET in the NAS-local .env next to this file.
      ConnectionStrings__DefaultConnection: "Host=aquaplan-db;Port=5432;Database=aquaplan;Username=aquaplan;Password=${DB_PASSWORD:?DB_PASSWORD is required (define it in the NAS-local .env)}"
      Jwt__SecretKey: "${JWT_SECRET:?JWT_SECRET is required (min 32 chars, define it in the NAS-local .env)}"
      Jwt__Issuer: "AquaPlan"
      Jwt__Audience: "AquaPlan"
      # Sprint Sec F-002 — initial admin account (one-shot): set both variables for the
      # first boot, then remove them. The dev admin is no longer seeded in Production.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      aquaplan-db:
        condition: service_healthy
    networks:
      - aquaplan-net
    mem_limit: 384m
    # Audit F-036cc — health probe. The aspnet-alpine image ships busybox wget
    # (no curl). start_period covers EF migrations + seeding at first boot.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  aquaplan-web:
    image: francoischarriere/aquaplan-web:${TAG:-latest}
    container_name: aquaplan-web
    restart: unless-stopped
    ports:
      - "8880:80"
    depends_on:
      aquaplan-api:
        condition: service_healthy
    networks:
      - aquaplan-net
    mem_limit: 64m
    # Audit F-036cc — nginx:alpine ships busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aquaplan-net:
    driver: bridge

volumes:
  aquaplan-db-data:
